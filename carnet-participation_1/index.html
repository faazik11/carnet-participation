<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet de participation</title>
<meta name="theme-color" content="#2346c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Participation">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout : un carnet Seyès sur téléphone — barre de séance collante en haut, une ligne par élève, gros boutons −/+ à droite. */
:root{
  --paper:#fbfcff; --surface:#ffffff; --ink:#1b2340; --muted:#626b8a;
  --rule:#d9e1f5; --margin:#e7a3a8; --accent:#2346c8; --accent-soft:#e6ecff;
  --plus:#17804a; --plus-soft:#e3f4ea; --minus:#c2303c; --minus-soft:#fbe6e8;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11152a; --surface:#181d36; --ink:#e7eaf8; --muted:#9aa2c4;
  --rule:#252b4a; --margin:#7a3a44; --accent:#8ea6ff; --accent-soft:#232c55;
  --plus:#5fd193; --plus-soft:#173326; --minus:#ff7e88; --minus-soft:#3a1b22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11152a; --surface:#181d36; --ink:#e7eaf8; --muted:#9aa2c4;
  --rule:#252b4a; --margin:#7a3a44; --accent:#8ea6ff; --accent-soft:#232c55;
  --plus:#5fd193; --plus-soft:#173326; --minus:#ff7e88; --minus-soft:#3a1b22; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--paper);color:var(--ink);font:16px/1.4 var(--body);
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--margin);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:800 1.35rem/1.1 var(--display);margin:0;letter-spacing:-.01em}
.sync{font-size:.75rem;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

.datebar{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.datebar .lbl{flex:1;text-align:center;font:600 1.05rem var(--display);text-transform:capitalize}
.datebar .sub{display:block;font:400 .78rem var(--body);color:var(--muted);text-transform:none}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rule);background:var(--surface);font-size:1.2rem;display:grid;place-items:center}
.today{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700}

.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;font-size:.85rem;color:var(--muted)}
.seg{display:flex;border:1.5px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:.82rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--rule);border-left:3px solid var(--margin);border-radius:10px;padding:8px 8px 8px 12px}
.name{border:0;background:none;text-align:left;padding:4px 0;min-width:0}
.name b{display:block;font-weight:700;overflow-wrap:anywhere}
.name small{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
.score{min-width:2.6ch;text-align:center;font:800 1.5rem var(--display);font-variant-numeric:tabular-nums}
.score.pos{color:var(--plus)} .score.neg{color:var(--minus)} .score.zero{color:var(--muted);opacity:.6}
.pm{width:52px;height:52px;border-radius:12px;border:0;font:800 1.6rem/1 var(--display);touch-action:manipulation}
.pm.minus{background:var(--minus-soft);color:var(--minus)}
.pm.plus{background:var(--plus-soft);color:var(--plus);width:64px}
.pm:active{transform:scale(.94)}
.bump{animation:bump .25s ease}
@keyframes bump{50%{transform:scale(1.25)}}

.empty{background:var(--surface);border:1.5px dashed var(--rule);border-radius:12px;padding:20px;text-align:center;color:var(--muted);margin-top:14px}
.empty strong{display:block;color:var(--ink);font:600 1.1rem var(--display);margin-bottom:4px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border:1.5px solid var(--rule);color:var(--ink)}
.btn.danger{background:var(--minus);color:var(--surface)}

section.panel{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px}
.card h2{font:600 1.05rem var(--display);margin:0 0 8px}
textarea{width:100%;min-height:120px;border:1.5px solid var(--rule);border-radius:10px;padding:10px;font:inherit;background:var(--paper);color:var(--ink);resize:vertical}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 10px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--rule)}
.mrow:first-child{border-top:0}
.mrow span{min-width:0;overflow-wrap:anywhere}
.del{border:1.5px solid var(--rule);background:transparent;border-radius:8px;padding:6px 10px;font-size:.82rem;color:var(--minus)}
.del.confirm{background:var(--minus);color:var(--surface);border-color:var(--minus)}

.hday{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 0;border-top:1px solid var(--rule);text-align:left}
.hday:first-of-type{border-top:0}
.hday .d{flex:1;text-transform:capitalize;font-weight:700}
.hday .d small{display:block;font-weight:400;color:var(--muted);text-transform:none}
.pill{border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.pill.p{background:var(--plus-soft);color:var(--plus)} .pill.m{background:var(--minus-soft);color:var(--minus)}

.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{font:800 1.3rem var(--display);margin:0}
.big{display:flex;gap:10px;margin:12px 0}
.big div{flex:1;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px;text-align:center}
.big b{display:block;font:800 1.6rem var(--display);font-variant-numeric:tabular-nums}
.big span{font-size:.78rem;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:0 6px 24px rgb(0 0 0 / .25);max-width:calc(100% - 32px)}
.toast button{border:0;background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 12px;font-weight:700}
.notice{font-size:.82rem;background:var(--minus-soft);color:var(--minus);border-radius:10px;padding:10px 12px;margin-top:12px}
.backup{display:flex;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion:reduce){.bump{animation:none}.pm:active{transform:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="bar">
    <div class="top"><h1>Participation</h1><span class="sync" id="sync">Connexion…</span></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-seance" aria-selected="true">Séance</button>
      <button class="tab" role="tab" id="t-hist" aria-selected="false">Historique</button>
      <button class="tab" role="tab" id="t-eleves" aria-selected="false">Élèves</button>
    </div>
  </header>
  <div id="notice"></div>
  <main id="view"></main>
</div>
<div id="overlay"></div>
<div id="toastHost"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dateOf = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const fmtLong = k => dateOf(k).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fmtShort = k => dateOf(k).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const sign = n => n>0 ? '+'+n : String(n);

const S = {
  tab:'seance', date:keyOf(new Date()), sort:'alpha',
  students:[], days:{}, loaded:false, db:null,
  undo:[], dirty:new Set(), inflight:new Set(), confirmDel:null,
};

/* ---------- données ---------- */
function totalOf(id){ let t=0; for(const k in S.days){ t += (S.days[k].points||{})[id]||0; } return t; }
function dayPts(k,id){ return ((S.days[k]||{}).points||{})[id]||0; }

function change(id, delta){
  const k = S.date;
  const day = S.days[k] ? structuredClone(S.days[k]) : {points:{},log:[]};
  day.points = day.points||{}; day.log = day.log||[];
  day.points[id] = (day.points[id]||0) + delta;
  if(day.points[id]===0) delete day.points[id];
  day.log.push({s:id,d:delta,t:Date.now()});
  if(day.log.length>300) day.log = day.log.slice(-300);
  S.days[k] = day;
  S.undo.push({k,id,delta});
  queueWrite(k);
  render(id);
  const st = S.students.find(s=>s.id===id);
  toast((delta>0?'+1 pour ':'−1 pour ')+(st?st.name:'élève'), true);
}
function undoLast(){
  const u = S.undo.pop(); if(!u) return;
  const day = structuredClone(S.days[u.k]||{points:{},log:[]});
  day.points[u.id] = (day.points[u.id]||0) - u.delta;
  if(day.points[u.id]===0) delete day.points[u.id];
  for(let i=day.log.length-1;i>=0;i--){ if(day.log[i].s===u.id && day.log[i].d===u.delta){ day.log.splice(i,1); break; } }
  S.days[u.k] = day; queueWrite(u.k); render(); toast('Action annulée');
}

/* stockage sur le téléphone */
const KEY = 'carnet-participation-v1';
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({students:S.students, days:S.days, savedAt:Date.now()}));
    setSync('Enregistré sur ce téléphone');
  }catch(e){
    setSync('Erreur'); notice('Impossible d’enregistrer sur ce téléphone (stockage plein ou navigation privée). Fais une sauvegarde depuis l’onglet Élèves.');
  }
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    S.students = Array.isArray(d.students) ? d.students.filter(s=>s && s.id && s.name) : [];
    S.days = d.days && typeof d.days==='object' ? d.days : {};
  }catch(e){ notice('Les données enregistrées n’ont pas pu être lues.'); }
}
function queueWrite(){ save(); }

function newId(){ return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
async function addStudents(text){
  const names = text.split(/\n|;/).map(s=>s.trim()).filter(Boolean);
  if(!names.length) return;
  const existing = new Set(S.students.map(s=>s.name.toLowerCase()));
  const fresh = [...new Set(names)].filter(n=>!existing.has(n.toLowerCase()));
  fresh.forEach(n=>S.students.push({id:newId(), name:n}));
  sortStudents(); save(); render();
  toast(fresh.length+' élève'+(fresh.length>1?'s':'')+' ajouté'+(fresh.length>1?'s':''));
}
async function removeStudent(id){
  S.confirmDel=null;
  S.students = S.students.filter(s=>s.id!==id);
  save(); render(); toast('Élève retiré');
}

/* sauvegarde / restauration par fichier */
function exportBackup(){
  const data = JSON.stringify({app:'carnet-participation', version:1, exportedAt:new Date().toISOString(), students:S.students, days:S.days}, null, 1);
  const blob = new Blob([data], {type:'application/json'});
  const name = 'participation-' + keyOf(new Date()) + '.json';
  const file = new File([blob], name, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:name}).catch(()=>{});
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function exportCsv(){
  const keys = Object.keys(S.days).filter(k=>Object.keys(S.days[k].points||{}).length).sort();
  const q = v => '"' + String(v).replace(/"/g,'""') + '"';
  const lines = [['Élève', ...keys, 'Total'].map(q).join(';')];
  for(const s of S.students) lines.push([q(s.name), ...keys.map(k=>dayPts(k,s.id)), totalOf(s.id)].join(';'));
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv'});
  const name = 'participation-' + keyOf(new Date()) + '.csv';
  const file = new File([blob], name, {type:'text/csv'});
  if(navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file], title:name}).catch(()=>{}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.students) || typeof d.days!=='object') throw 0;
      S.students = d.students.filter(s=>s && s.id && s.name); S.days = d.days || {};
      S.undo = []; sortStudents(); save(); render();
      toast('Sauvegarde restaurée : ' + S.students.length + ' élèves');
    }catch(e){ notice('Ce fichier n’est pas une sauvegarde du carnet.'); }
  };
  r.readAsText(file);
}
function sortStudents(){ S.students.sort((a,b)=>a.name.localeCompare(b.name,'fr',{sensitivity:'base'})); }

/* ---------- rendu ---------- */
function render(bumpId){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', String(t.id==='t-'+S.tab)));
  const v = $('#view');
  const draft = $('#names') ? $('#names').value : '';
  if(S.tab==='seance') v.innerHTML = viewSeance();
  else if(S.tab==='hist') v.innerHTML = viewHist();
  else { v.innerHTML = viewEleves(); if(draft) $('#names').value = draft; }
  if(bumpId){ const el = v.querySelector('[data-score="'+bumpId+'"]'); if(el){ el.classList.add('bump'); } }
}

function viewSeance(){
  const isToday = S.date===keyOf(new Date());
  const dayTotal = Object.values((S.days[S.date]||{}).points||{}).reduce((a,b)=>a+b,0);
  const nb = Object.keys((S.days[S.date]||{}).points||{}).length;
  let h = `<div class="datebar">
    <button class="iconbtn" data-act="prev" aria-label="Jour précédent">‹</button>
    <div class="lbl">${esc(fmtLong(S.date))}<span class="sub">${nb} élève${nb>1?'s':''} noté${nb>1?'s':''} · total ${sign(dayTotal)}</span></div>
    <button class="iconbtn" data-act="next" aria-label="Jour suivant">›</button>
  </div>`;
  if(!S.loaded) return h + `<div class="empty"><strong>Chargement du carnet…</strong></div>`;
  if(!S.students.length) return h + `<div class="empty"><strong>Aucun élève pour l’instant</strong>Ajoute ta classe dans l’onglet Élèves : colle simplement la liste des prénoms.<br><br><button class="btn" data-act="go-eleves">Ajouter des élèves</button></div>`;
  h += `<div class="tools">${isToday?'<span>Aujourd’hui</span>':'<button class="today" data-act="today">Revenir à aujourd’hui</button>'}
    <div class="seg" role="group" aria-label="Trier">
      <button data-sort="alpha" aria-pressed="${S.sort==='alpha'}">A→Z</button>
      <button data-sort="jour" aria-pressed="${S.sort==='jour'}">Séance</button>
      <button data-sort="total" aria-pressed="${S.sort==='total'}">Total</button>
    </div></div><ul class="list">`;
  let list = [...S.students];
  if(S.sort==='jour') list.sort((a,b)=>dayPts(S.date,b.id)-dayPts(S.date,a.id));
  if(S.sort==='total') list.sort((a,b)=>totalOf(b.id)-totalOf(a.id));
  for(const s of list){
    const p = dayPts(S.date,s.id), t = totalOf(s.id);
    h += `<li class="row">
      <button class="name" data-act="detail" data-id="${s.id}"><b>${esc(s.name)}</b><small>Total ${sign(t)}</small></button>
      <span class="score ${p>0?'pos':p<0?'neg':'zero'}" data-score="${s.id}" aria-label="Points de la séance">${p===0?'0':sign(p)}</span>
      <button class="pm minus" data-act="minus" data-id="${s.id}" aria-label="Retirer un point à ${esc(s.name)}">−</button>
      <button class="pm plus" data-act="plus" data-id="${s.id}" aria-label="Ajouter un point à ${esc(s.name)}">+</button>
    </li>`;
  }
  return h + `</ul>`;
}

function viewHist(){
  const keys = Object.keys(S.days).filter(k=>Object.keys(S.days[k].points||{}).length).sort().reverse();
  if(!keys.length) return `<section class="panel"><div class="empty"><strong>Pas encore d’historique</strong>Les séances apparaîtront ici dès le premier point donné.</div></section>`;
  let h = `<section class="panel"><div class="card"><h2>Séances</h2>`;
  for(const k of keys){
    const pts = Object.values(S.days[k].points);
    const plus = pts.filter(n=>n>0).reduce((a,b)=>a+b,0), minus = pts.filter(n=>n<0).reduce((a,b)=>a+b,0);
    h += `<button class="hday" data-act="open-day" data-k="${k}"><span class="d">${esc(fmtLong(k))}<small>${pts.length} élève${pts.length>1?'s':''} noté${pts.length>1?'s':''}</small></span>
      ${plus?`<span class="pill p">+${plus}</span>`:''}${minus?`<span class="pill m">${minus}</span>`:''}</button>`;
  }
  h += `</div>`;
  if(S.students.length){
    const ranked = [...S.students].map(s=>({s,t:totalOf(s.id)})).sort((a,b)=>b.t-a.t);
    h += `<div class="card"><h2>Totaux depuis le début</h2>`;
    for(const r of ranked) h += `<div class="mrow"><span>${esc(r.s.name)}</span><span class="pill ${r.t<0?'m':'p'}">${sign(r.t)}</span></div>`;
    h += `</div>`;
  }
  return h + `</section>`;
}

function viewEleves(){
  let h = `<section class="panel"><div class="card"><h2>Ajouter des élèves</h2>
    <textarea id="names" placeholder="Inès&#10;Lucas&#10;Mohamed&#10;Chloé"></textarea>
    <p class="hint">Un prénom par ligne. Tu peux coller toute la liste de la classe d’un coup.</p>
    <button class="btn" data-act="add">Ajouter</button></div>`;
  h += `<div class="card"><h2>Classe (${S.students.length})</h2>`;
  if(!S.students.length) h += `<p class="hint">Aucun élève pour l’instant.</p>`;
  for(const s of S.students){
    const c = S.confirmDel===s.id;
    h += `<div class="mrow"><span>${esc(s.name)}</span><button class="del ${c?'confirm':''}" data-act="del" data-id="${s.id}">${c?'Confirmer':'Retirer'}</button></div>`;
  }
  h += `</div>`;
  h += `<div class="card"><h2>Sauvegarde</h2>
    <p class="hint">Les points sont gardés sur ce téléphone uniquement. Fais une sauvegarde de temps en temps (envoie-la-toi par mail ou mets-la dans ton Drive) : elle permet de tout récupérer sur un autre appareil.</p>
    <div class="backup">
      <button class="btn" data-act="export">Sauvegarder</button>
      <button class="btn ghost" data-act="import">Restaurer</button>
      <button class="btn ghost" data-act="csv">Exporter en CSV</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>`;
  return h + `</section>`;
}

function openDetail(id){
  const s = S.students.find(x=>x.id===id); if(!s) return;
  const keys = Object.keys(S.days).filter(k=>dayPts(k,id)!==0).sort().reverse();
  let plus=0, minus=0;
  for(const k of Object.keys(S.days)) for(const e of (S.days[k].log||[])) if(e.s===id){ e.d>0?plus++:minus++; }
  let h = `<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-label="${esc(s.name)}">
    <div class="top"><h2>${esc(s.name)}</h2><button class="iconbtn" data-act="close" aria-label="Fermer">×</button></div>
    <div class="big"><div><b>${sign(totalOf(id))}</b><span>total</span></div><div><b>${plus}</b><span>participations</span></div><div><b>${minus}</b><span>points retirés</span></div></div>`;
  if(!keys.length) h += `<p class="hint">Aucun point pour l’instant.</p>`;
  for(const k of keys){ const p = dayPts(k,id); h += `<div class="mrow"><span style="text-transform:capitalize">${esc(fmtShort(k))}</span><span class="pill ${p<0?'m':'p'}">${sign(p)}</span></div>`; }
  $('#overlay').innerHTML = h + `</div></div>`;
}

let toastTimer;
function toast(msg, withUndo){
  clearTimeout(toastTimer);
  $('#toastHost').innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${withUndo?'<button data-act="undo">Annuler</button>':''}</div>`;
  toastTimer = setTimeout(()=>{ $('#toastHost').innerHTML=''; }, 3500);
}
function setSync(t){ $('#sync').textContent = t; }
function notice(t){ $('#notice').innerHTML = t ? `<div class="notice">${esc(t)}</div>` : ''; }

/* ---------- événements ---------- */
document.addEventListener('click', e=>{
  const tab = e.target.closest('.tab');
  if(tab){ S.tab = tab.id.slice(2); S.confirmDel=null; render(); window.scrollTo(0,0); return; }
  const sb = e.target.closest('[data-sort]');
  if(sb){ S.sort = sb.dataset.sort; render(); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const id = b.dataset.id;
  switch(b.dataset.act){
    case 'plus': change(id,1); break;
    case 'minus': change(id,-1); break;
    case 'undo': undoLast(); $('#toastHost').innerHTML=''; break;
    case 'prev': { const d=dateOf(S.date); d.setDate(d.getDate()-1); S.date=keyOf(d); render(); break; }
    case 'next': { const d=dateOf(S.date); d.setDate(d.getDate()+1); S.date=keyOf(d); render(); break; }
    case 'today': S.date=keyOf(new Date()); render(); break;
    case 'go-eleves': S.tab='eleves'; render(); break;
    case 'open-day': S.date=b.dataset.k; S.tab='seance'; render(); window.scrollTo(0,0); break;
    case 'detail': openDetail(id); break;
    case 'close': if(e.target===b || b.classList.contains('iconbtn')) $('#overlay').innerHTML=''; break;
    case 'add': { const ta=$('#names'); const v=ta.value; ta.value=''; addStudents(v).catch(err=>notice('Ajout impossible ('+(err&&err.code||'erreur')+').')); break; }
    case 'export': exportBackup(); break;
    case 'csv': exportCsv(); break;
    case 'import': $('#importFile').click(); break;
    case 'del': if(S.confirmDel===id) removeStudent(id).catch(()=>notice('Suppression impossible.')); else { S.confirmDel=id; render(); } break;
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') $('#overlay').innerHTML=''; });

/* ---------- démarrage ---------- */
document.addEventListener('change', e=>{
  if(e.target.id==='importFile' && e.target.files[0]){ importBackup(e.target.files[0]); e.target.value=''; }
});

load(); sortStudents(); S.loaded = true;
setSync(S.students.length ? 'Enregistré sur ce téléphone' : '');
render();

/* l'appli revient sur aujourd'hui si on la rouvre un autre jour */
let lastToday = keyOf(new Date());
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState!=='visible') return;
  const t = keyOf(new Date());
  if(t!==lastToday){ if(S.date===lastToday) S.date=t; lastToday=t; render(); }
});

/* demande au navigateur de ne pas effacer les données */
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator) window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
